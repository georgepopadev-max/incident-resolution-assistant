version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: incident-ai-db
    environment:
      POSTGRES_DB: incidentdb
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident123
    ports:
      - "5434:5432"
    volumes:
      - postgres_incident_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incidentdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_incident_data: